name: Release paircli

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Build release artifacts
        run: |
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          PAIRCLI_RELEASE_OUTPUT_DIR="$GITHUB_WORKSPACE/dist/paircli" \
            bash scripts/build-release-artifacts.sh "$VERSION"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/paircli/${{ env.RELEASE_VERSION }}/**
            dist/paircli/latest.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/paircli/${{ env.RELEASE_VERSION }}/**
            dist/paircli/latest.json
